[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-risk-intelligence"
version = "1.0.0"
description = "Reproducible decision-support prototype for calibrated and explainable credit-default risk intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maik Hübner" }]
keywords = ["machine-learning", "credit-risk", "explainability", "fairness", "calibration"]
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "seaborn>=0.13,<1",
  "shap>=0.47,<1",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
risk-intelligence = "explainable_risk_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainable_risk_intelligence = ["resources/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end tests that train a small model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
